name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{secrets.VPS_PASS}}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "dist/"
          target: ${{ secrets.VPS_TARGET_DIR }}
          strip_components: 1

      - name: Debug - check Apache document root
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{secrets.VPS_PASS}}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== Enabled Apache sites ==="
            ls /etc/apache2/sites-enabled/
            echo "=== stephennicholasjones.com HTTP config ==="
            cat /etc/apache2/sites-enabled/stephennicholasjones.com.conf
            echo ""
            echo "=== stephennicholasjones.com HTTPS config ==="
            cat /etc/apache2/sites-enabled/stephennicholasjones.com-le-ssl.conf
            echo "=== Deployed directory contents ==="
            ls -la ${{ secrets.VPS_TARGET_DIR }}
            echo "=== Check .htaccess ==="
            cat ${{ secrets.VPS_TARGET_DIR }}/.htaccess 2>/dev/null || echo "No .htaccess file"
            echo "=== Check Apache cache modules ==="
            apachectl -M 2>/dev/null | grep -i cache || echo "No cache modules"
            echo "=== Check old files in parent ==="
            ls -la ${{ secrets.VPS_TARGET_DIR }}/../ | head -10
            echo "=== External fetch (what the world sees) ==="
            curl -sI https://stephennicholasjones.com 2>/dev/null | head -15
            echo "=== Compare file sizes ==="
            echo "File on disk: $(wc -c < ${{ secrets.VPS_TARGET_DIR }}/index.html) bytes"
            echo "File from web: $(curl -sL https://stephennicholasjones.com 2>/dev/null | wc -c) bytes"
            echo "=== 000-default.conf ==="
            cat /etc/apache2/sites-enabled/000-default.conf 2>/dev/null || echo "No 000-default"
            echo "=== Check which vhost handles port 443 ==="
            grep -l ":443" /etc/apache2/sites-enabled/*.conf 2>/dev/null
            echo "=== Check if target dir is a symlink ==="
            ls -la /var/www/stephennicholasjones.com/
            echo "=== Check actual file details ==="
            stat ${{ secrets.VPS_TARGET_DIR }}/index.html
            echo "=== Check file content hash ==="
            md5sum ${{ secrets.VPS_TARGET_DIR }}/index.html
            echo "=== What Apache actually serves (full body first line) ==="
            curl -sL https://stephennicholasjones.com 2>/dev/null | head -1 | cut -c1-200

      - name: Verify and fix permissions
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{secrets.VPS_PASS}}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            ls -la ${{ secrets.VPS_TARGET_DIR }}
            sudo chown -R www-data:www-data ${{ secrets.VPS_TARGET_DIR }}
            sudo chmod -R 755 ${{ secrets.VPS_TARGET_DIR }}
            sudo systemctl reload apache2
            echo "Deployment verified and Apache reloaded"
