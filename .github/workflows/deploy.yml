name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{secrets.VPS_PASS}}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "dist/"
          target: ${{ secrets.VPS_TARGET_DIR }}
          strip_components: 1

      - name: Debug - check Apache document root
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{secrets.VPS_PASS}}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== Enabled Apache sites ==="
            ls /etc/apache2/sites-enabled/
            echo "=== stephennicholasjones.com HTTP config ==="
            cat /etc/apache2/sites-enabled/stephennicholasjones.com.conf
            echo ""
            echo "=== stephennicholasjones.com HTTPS config ==="
            cat /etc/apache2/sites-enabled/stephennicholasjones.com-le-ssl.conf
            echo "=== Deployed directory contents ==="
            ls -la ${{ secrets.VPS_TARGET_DIR }}
            echo "=== Check .htaccess ==="
            cat ${{ secrets.VPS_TARGET_DIR }}/.htaccess 2>/dev/null || echo "No .htaccess file"
            echo "=== Check Apache cache modules ==="
            apachectl -M 2>/dev/null | grep -i cache || echo "No cache modules"
            echo "=== Check old files in parent ==="
            ls -la ${{ secrets.VPS_TARGET_DIR }}/../ | head -10
            echo "=== External fetch (what the world sees) ==="
            curl -sI https://stephennicholasjones.com 2>/dev/null | head -15
            echo "=== Compare file sizes ==="
            echo "File on disk: $(wc -c < ${{ secrets.VPS_TARGET_DIR }}/index.html) bytes"
            echo "File from web: $(curl -sL https://stephennicholasjones.com 2>/dev/null | wc -c) bytes"
            echo "=== 000-default.conf ==="
            cat /etc/apache2/sites-enabled/000-default.conf 2>/dev/null || echo "No 000-default"
            echo "=== Check which vhost handles port 443 ==="
            grep -l ":443" /etc/apache2/sites-enabled/*.conf 2>/dev/null
            echo "=== Check if target dir is a symlink ==="
            ls -la /var/www/stephennicholasjones.com/
            echo "=== Check actual file details ==="
            stat ${{ secrets.VPS_TARGET_DIR }}/index.html
            echo "=== Check file content hash ==="
            md5sum ${{ secrets.VPS_TARGET_DIR }}/index.html
            echo "=== Check deflate module ==="
            apachectl -M 2>/dev/null | grep -i deflate || echo "No deflate module"
            echo "=== What Apache serves (DECOMPRESSED size) ==="
            curl -sL --compressed https://stephennicholasjones.com 2>/dev/null | wc -c
            echo "=== What Apache serves (COMPRESSED size) ==="
            curl -sL https://stephennicholasjones.com 2>/dev/null | wc -c
            echo "=== File on disk size ==="
            wc -c < ${{ secrets.VPS_TARGET_DIR }}/index.html
            echo "=== Check local DNS resolution ==="
            nslookup stephennicholasjones.com 2>/dev/null | grep -A1 "Name" || dig stephennicholasjones.com +short
            echo "=== Check Apache access log for the request ==="
            sudo tail -5 /var/log/apache2/stephennicholasjones.com_access.log 2>/dev/null || sudo tail -5 /var/log/apache2/access.log 2>/dev/null
            echo "=== Full verbose curl response ==="
            curl -sL --compressed -D - https://stephennicholasjones.com 2>/dev/null | head -30
            echo "=== Check for any .htaccess in parent dirs ==="
            sudo find /var/www/stephennicholasjones.com -name ".htaccess" 2>/dev/null
            echo "=== Check all enabled SSL configs for ServerName ==="
            grep -A1 "ServerName" /etc/apache2/sites-enabled/*-ssl.conf 2>/dev/null
            echo "=== Apache full config dump ==="
            sudo apache2ctl -S 2>&1 | head -30
            echo "=== Full module list ==="
            apachectl -M 2>/dev/null | sort
            echo "=== Check for override configs ==="
            ls -la /etc/apache2/conf-enabled/ 2>/dev/null
            echo "=== MD5 of what Apache actually serves ==="
            curl -sL --compressed https://stephennicholasjones.com 2>/dev/null | md5sum
            echo "=== MD5 of file on disk ==="
            md5sum < ${{ secrets.VPS_TARGET_DIR }}/index.html

      - name: Verify and fix permissions
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{secrets.VPS_PASS}}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            ls -la ${{ secrets.VPS_TARGET_DIR }}
            sudo chown -R www-data:www-data ${{ secrets.VPS_TARGET_DIR }}
            sudo chmod -R 755 ${{ secrets.VPS_TARGET_DIR }}
            sudo systemctl reload apache2
            echo "Deployment verified and Apache reloaded"
