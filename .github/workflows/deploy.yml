name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{secrets.VPS_PASS}}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "dist/"
          target: ${{ secrets.VPS_TARGET_DIR }}
          strip_components: 1

      - name: Debug - check Apache document root
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{secrets.VPS_PASS}}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== Enabled Apache sites ==="
            ls /etc/apache2/sites-enabled/
            echo "=== Document roots ==="
            grep -r "DocumentRoot" /etc/apache2/sites-enabled/ || true
            echo "=== Deployed directory contents ==="
            ls -la ${{ secrets.VPS_TARGET_DIR }} | head -20
            echo "=== Target dir ==="
            echo "${{ secrets.VPS_TARGET_DIR }}"
            echo "=== Does DocumentRoot match? ==="
            echo "Compare the DocumentRoot above with the target dir"

      - name: Verify and fix permissions
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{secrets.VPS_PASS}}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            ls -la ${{ secrets.VPS_TARGET_DIR }}
            sudo chown -R www-data:www-data ${{ secrets.VPS_TARGET_DIR }}
            sudo chmod -R 755 ${{ secrets.VPS_TARGET_DIR }}
            sudo systemctl reload apache2
            echo "Deployment verified and Apache reloaded"
